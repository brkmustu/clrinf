[package]
name = "clrinf-codegen"
version = "0.1.0"
edition = "2021"
description = "Polyglot code generation CLI tool for the clrinf ecosystem"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = "1.20"
jsonschema = "0.28"
walkdir = "2.5"
heck = "0.5"
anyhow = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
