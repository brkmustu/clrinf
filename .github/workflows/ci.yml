name: clrinf Polyglot CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLRINF_CONFORMANCE_DIR: ${{ github.workspace }}/tests/conformance/fixtures

jobs:
  rust:
    name: Rust (clrinfrs + clrinf-codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clrinfrs
            tools/clrinf-codegen
      - name: clrinfrs fmt/clippy/test
        working-directory: clrinfrs
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: clrinf-codegen build/test
        working-directory: tools/clrinf-codegen
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  dotnet:
    name: C# (clrinfcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: clrinfcs
        run: dotnet restore clrinf.slnx
      - name: Build (warnings as errors)
        working-directory: clrinfcs
        run: dotnet build clrinf.slnx -c Release --no-restore -warnaserror
      - name: Test
        working-directory: clrinfcs
        run: dotnet test tests/ClrInfTests/ClrInfTests.csproj -c Release --no-build --logger "trx"

  typescript:
    name: TypeScript (clrinfjs)
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10.29-alpine
        ports:
          - 4222:4222
    env:
      CLRINF_NATS_TEST_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install & test
        working-directory: clrinfjs
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  elixir:
    name: Elixir (clrinfex)
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10.29-alpine
        ports:
          - 4222:4222
    env:
      NATS_TEST_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - uses: actions/cache@v4
        with:
          path: |
            clrinfex/deps
            clrinfex/_build
          key: mix-${{ runner.os }}-${{ hashFiles('clrinfex/mix.lock') }}
      - name: Compile (warnings as errors) & test
        working-directory: clrinfex
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test --no-start --warnings-as-errors

  contracts:
    name: Contracts validate & codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/clrinf-codegen
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Validate schemas and canonical fixtures
        run: |
          cargo run -q --manifest-path tools/clrinf-codegen/Cargo.toml -- validate --schema-dir ./clrinf-contracts/schemas
          cargo run -q --manifest-path tools/clrinf-codegen/Cargo.toml -- validate --schema-dir ./examples/contracts/schemas
          cargo test --manifest-path tools/clrinf-codegen/Cargo.toml
      - name: Regenerate core and example contracts separately
        run: bash tests/generated/regenerate.sh
      - name: Compile and exercise all generated language targets
        run: bash tests/generated/check.sh
      - name: Generated code must be committed (no drift)
        run: |
          changes="$(git status --porcelain --untracked-files=all -- tests/generated)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "::error::Generated code drifted from contracts; regenerate and include all outputs"
            exit 1
          fi

  docs:
    name: Documentation links and architectural boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - run: bun test tests/docs
      - name: Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet

  e2e:
    name: E2E (docker-compose.test.yml, strict)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run stack and tests
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
