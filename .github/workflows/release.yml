name: Release & Distribute Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for ARM64 Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --manifest-path tools/clrinf-codegen/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path tools/clrinf-codegen/Cargo.toml --target ${{ matrix.target }}
          fi

      - name: Package Artifact
        shell: bash
        run: |
          BIN_PATH="tools/clrinf-codegen/target/${{ matrix.target }}/release/clrinf-codegen"
          STAGE_DIR=$(mktemp -d)
          cp "${BIN_PATH}" "${STAGE_DIR}/clrinf-codegen"
          cp "${BIN_PATH}" "${STAGE_DIR}/clrinf"
          
          ARCHIVE_NAME="clrinf-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C "${STAGE_DIR}" clrinf-codegen clrinf
          
          # Generate SHA256 checksum
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clrinf-${{ matrix.target }}.tar.gz
            clrinf-${{ matrix.target }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
