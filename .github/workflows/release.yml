name: Release & Distribute Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for ARM64 Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --manifest-path tools/clrinf-codegen/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path tools/clrinf-codegen/Cargo.toml --target ${{ matrix.target }}
          fi

      - name: Package Artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_PATH="tools/clrinf-codegen/target/${{ matrix.target }}/release/clrinf-codegen"
          STAGE_DIR=$(mktemp -d)
          cp "${BIN_PATH}" "${STAGE_DIR}/clrinf-codegen"
          cp "${BIN_PATH}" "${STAGE_DIR}/clrinf"

          ARCHIVE_NAME="clrinf-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C "${STAGE_DIR}" clrinf-codegen clrinf

          if command -v sha256sum &> /dev/null; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binPath = "tools/clrinf-codegen/target/${{ matrix.target }}/release/clrinf-codegen.exe"
          $stageDir = Join-Path $env:RUNNER_TEMP "clrinf-stage"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item $binPath (Join-Path $stageDir "clrinf-codegen.exe") -Force
          Copy-Item $binPath (Join-Path $stageDir "clrinf.exe") -Force

          $archiveName = "clrinf-${{ matrix.target }}.zip"
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $archiveName -Force

          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Out-File -FilePath "${archiveName}.sha256" -Encoding ascii

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clrinf-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
