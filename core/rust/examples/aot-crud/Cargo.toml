[package]
name = "clrinf-aot-crud"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
axum = "0.7"
clrinf-adapters = { path = "../../crates/clrinf-adapters" }
clrinf-core = { path = "../../crates/clrinf-core" }
clrinf-macros = { path = "../../crates/clrinf-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
