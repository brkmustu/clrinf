[package]
name = "clrinf-kampanya"
version = "0.1.0"
edition = "2021"
description = "Ultra high-performance Rust Campaign & Constraint Solver Engine for clrinf"

[dependencies]
clrinf-core = { path = "../../crates/clrinf-core" }
clrinf-adapters = { path = "../../crates/clrinf-adapters" }
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
