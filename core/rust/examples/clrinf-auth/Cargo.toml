[package]
name = "clrinf-auth"
version = "0.1.0"
edition = "2021"
description = "Configurable credential authentication, RS256 JWT/JWKS, and declarative authorization"

[lib]
name = "clrinf_auth"
path = "src/lib.rs"

[[bin]]
name = "clrinf-auth"
path = "src/main.rs"

[dependencies]
clrinf-core = { path = "../../crates/clrinf-core" }
clrinf-adapters = { path = "../../crates/clrinf-adapters" }
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }

[dev-dependencies]
rand = "0.8"
tower = { version = "0.5", features = ["util"] }
