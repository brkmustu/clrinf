[package]
name = "clrinf-cli"
version = "0.1.0"
edition = "2021"
description = "Specialized Rust application scaffold, CQRS generator, Syn AST linter and MCP server"

[[bin]]
name = "clrinfrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = { version = "2.7", features = ["loader"] }
colored = "2.1"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
