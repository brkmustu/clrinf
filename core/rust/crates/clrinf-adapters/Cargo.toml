[package]
name = "clrinf-adapters"
version = "0.1.0"
edition = "2021"
description = "Axum transport and process-local persistence adapters for clrinf-core"

[dependencies]
clrinf-core = { path = "../clrinf-core" }
axum = "0.7"
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
