[package]
name = "clrinf-adapters"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Axum transport and persistence adapters for clrinf-core"

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
clrinf-core = { path = "../clrinf-core" }
async-trait = "0.1"
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
