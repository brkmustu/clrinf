[package]
name = "clrinf-core"
version = "0.1.0"
edition = "2021"
description = "Transport-independent contracts and persistence ports for distributed and modular clrinf applications"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

