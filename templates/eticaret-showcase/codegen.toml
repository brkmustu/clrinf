[project]
name = "EticaretApp"
version = "1.0.0"
paradigm = "fp"
architecture = "clean-cqrs"

[backend]
path = "./backend"
namespace = "EticaretApp"
db_context = "BaseDbContext"

[backend.structure]
folder_name = "Moduller"
layout = "flat"

# 1. Kategori (Category / Taxonomy)
[[modules]]
name = "Kategori"
id_type = "int"
layout = "flat"
[[modules.properties]]
name = "Ad"
type = "string"
required = true
[[modules.properties]]
name = "Slug"
type = "string"
required = true
[[modules.properties]]
name = "UstKategoriId"
type = "int?"
required = false
[[modules.properties]]
name = "Sira"
type = "int"
required = true
[[modules.properties]]
name = "Aktif"
type = "bool"
required = true

